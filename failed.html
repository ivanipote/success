<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement annulé | Nature+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            animation: fadeUp 0.5s ease-out;
        }

        .icon {
            font-size: 72px;
            margin-bottom: 8px;
            animation: scaleIn 0.5s ease-out;
        }

        h1 {
            color: #721c24;
            font-size: 28px;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .sub {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8e8f0;
            border-top-color: #dc3545;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto;
        }

        .btn-retry {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 32px;
            background: #2d7d46;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.3s;
        }

        .btn-retry:hover {
            background: #1a5a33;
            transform: scale(1.02);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 22px; }
            .icon { font-size: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">❌</div>
        <h1>Paiement annulé</h1>
        <p>Vous n'avez pas finalisé le paiement.</p>
        <p class="sub">Mise à jour en cours...</p>
        <div class="spinner"></div>
        <a href="https://nature-gold-five.vercel.app/mescommandes" class="btn-retry">↩️ Voir mes commandes</a>
    </div>

    <script>
        // Récupérer l'ID de la commande depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const commandeId = urlParams.get('commande_id');

        console.log('📦 Commande ID:', commandeId);

        if (commandeId) {
            // Mettre à jour le statut de la commande
            fetch('https://nature-gold-five.vercel.app/api/payment/update-status', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    commandeId: commandeId,
                    status: 'annulee',
                    cause: 'Paiement non finalisé par le client'
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('✅ Statut mis à jour:', data);
                // Rediriger après 2 secondes
                setTimeout(() => {
                    window.location.href = 'https://nature-gold-five.vercel.app/mescommandes';
                }, 2000);
            })
            .catch(error => {
                console.error('❌ Erreur:', error);
                // Rediriger quand même après 2 secondes
                setTimeout(() => {
                    window.location.href = 'https://nature-gold-five.vercel.app/mescommandes';
                }, 2000);
            });
        } else {
            // Pas de commande_id, rediriger après 2 secondes
            setTimeout(() => {
                window.location.href = 'https://nature-gold-five.vercel.app/mescommandes';
            }, 2000);
        }
    </script>
</body>
</html>
